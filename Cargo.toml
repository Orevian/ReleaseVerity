[workspace]
resolver = "2"
members = ["crates/releaseverity-core", "crates/releaseverity-repro", "crates/releaseverity-services", "crates/releaseverity-cli", "crates/releaseverity-agent", "crates/releaseverity-shipcheck", "crates/releaseverity-desktop", "crates/releaseverity-github"]

# Single source of truth for the product version (GUI, CLI, EXE metadata,
# installer, reports). Everything else inherits it or reads it from here.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
authors = ["ReleaseVerity contributors"]
repository = "https://github.com/Orevian/ReleaseVerity"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

