name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Note: do not set RUSTFLAGS here — it would override .cargo/config.toml (static CRT).

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  typecheck:
    name: Typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  unit-tests:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins --locked

  integration-tests:
    name: Integration + end-to-end tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Real git repos, real processes, the real agent, the built-in AppContainer sandbox.
      - run: cargo test --workspace --tests --locked

  cross-platform:
    name: Core, Repro Engine and CLI on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p releaseverity-core -p releaseverity-repro -p releaseverity-github -p releaseverity-services -p releaseverity-cli

  build:
    name: Build (portable + installer)
    needs: [lint, typecheck, unit-tests, integration-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: scripts/build.ps1 -Target all
      - uses: actions/upload-artifact@v4
        with:
          name: releaseverity-windows-x64
          path: dist/artifacts/*
          if-no-files-found: error
