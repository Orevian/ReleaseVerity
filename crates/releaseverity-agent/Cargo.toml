[package]
name = "releaseverity-agent"
description = "ReleaseVerity ShipCheck agent: runs inside the clean environment (Windows Sandbox or a job-limited host directory) and reports what really happened"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "releaseverity_agent"
path = "src/lib.rs"

[[bin]]
name = "releaseverity-agent"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_Security_Isolation",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
] }
winreg = "0.56"

[dev-dependencies]
tempfile.workspace = true
